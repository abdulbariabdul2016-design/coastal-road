{% extends 'base.html' %}
{% block title %}إضافة ورقة{% endblock %}
{% block content %}
<h3 class="mb-4"><i class="bi bi-file-earmark-plus"></i> إضافة ورقة جديدة</h3>

<div class="card shadow-sm">
<div class="card-body">
<form method="POST" enctype="multipart/form-data">
    <div class="row g-3">
        <div class="col-md-8">
            <label class="form-label">عنوان الورقة *</label>
            <input type="text" name="title" class="form-control" required>
        </div>
        <div class="col-md-4">
            <label class="form-label">النوع *</label>
            <select name="category" class="form-select" required>
                <option value="" disabled selected>اختر النوع</option>
                {% for c in categories %}
                <option value="{{ c }}">{{ c }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="col-12">
            <label class="form-label">ملاحظات / وصف</label>
            <textarea name="description" class="form-control" rows="3"></textarea>
        </div>

        <div class="col-md-4">
            <label class="form-label">الجهة (اختياري)</label>
            <select name="side" class="form-select">
                <option value="">عام - غير مرتبط بجهة</option>
                {% for s in sides %}
                <option value="{{ s }}">{{ s }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label">نقطة الكيلومتر (اختياري)</label>
            <input type="number" step="0.01" min="0" name="km_point" class="form-control" placeholder="مثال: 25.5">
        </div>
        <div class="col-md-4">
            <label class="form-label">إرفاق ملف (PDF, Word, صورة)</label>
            <input type="file" name="file" class="form-control" accept=".pdf,.doc,.docx,.docm,.xls,.xlsx,.xlsm,.csv,.txt,.jpg,.jpeg,.png,.gif,.webp,.bmp,.tif,.tiff">
        </div>
    </div>

    <div class="mt-4">
        <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> حفظ</button>
        <a href="{{ url_for('documents_list') }}" class="btn btn-outline-secondary">إلغاء</a>
    </div>
</form>
</div>
</div>
{% endblock %}
